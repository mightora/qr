<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'">
  <title>QR code</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#fff}
    body{display:grid;place-items:center}
    #qr-only{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
    #qr-only canvas{display:block;max-width:100%;max-height:100%;object-fit:contain}
  </style>
</head>
<body>
  <main id="qr-only" aria-label="QR code image"></main>
  <script src="/assets/js/lib/qrcode.min.js"></script>
  <script src="/assets/js/qr-generator.js"></script>
  <script src="/assets/js/qr-share.js"></script>
</body>
</html>
